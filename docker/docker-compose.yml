name: nuxiva

services:
  nuxiva-core:
    build:
      context: ..
      dockerfile: docker/core/Dockerfile
      args:
        NUXIVA_SRC_HASH: ${NUXIVA_SRC_HASH:-dev}
    pull_policy: build
    container_name: nuxiva-core
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: /etc/nuxiva/nuxiva.env
        required: false
    environment:
      NUXIVA_ENV: production
      NUXIVA_HOST: 0.0.0.0
      NUXIVA_PORT: "8449"
      # Endpoint OmniRoute (compatibilità Ollama e OpenAI)
      OLLAMA_BASE_URL: http://10.0.0.105:20128
      OPENAI_BASE_URL: http://10.0.0.105:20128/v1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-omniroute}
      QDRANT_HOST: 127.0.0.1
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - nuxiva_db:/app/data/db
      - nuxiva_certs:/app/data/certs
      - nuxiva_models:/app/data/models
      - /run/nuxiva/sandbox:/run/nuxiva/sandbox
      - /var/lib/nuxiva/brain:/run/nuxiva/brain
    depends_on:
      - nuxiva-qdrant

  nuxiva-qdrant:
    image: qdrant/qdrant:latest
    container_name: nuxiva-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - nuxiva_qdrant:/qdrant/storage

volumes:
  nuxiva_db:
  nuxiva_certs:
  nuxiva_models:
  nuxiva_qdrant:
