name: nuxiva

services:
  nuxiva-core:
    build:
      context: ..
      dockerfile: docker/core/Dockerfile
      args:
        NUXIVA_SRC_HASH: ${NUXIVA_SRC_HASH:-dev}
    pull_policy: build
    container_name: nuxiva-core
    restart: unless-stopped
    ports:
      - "${NUXIVA_PUBLIC_PORT:-8444}:80" # Porta pubblica: kiosk, chat, wizard (mappata su 8444)
      - "${NUXIVA_ADMIN_PORT:-8445}:8080" # Porta admin: cockpit, REST API, MCP (mappata su 8445)
      - "127.0.0.1:8443:8443" # Core backend (solo localhost)
    env_file:
      - path: /etc/nuxiva/nuxiva.env
        required: false
    environment:
      NUXIVA_ENV: production

      # Porte architettura originale
      NUXIVA_PUBLIC_PORT: 80
      NUXIVA_ADMIN_PORT: 8080
      NUXIVA_CORE_URL: http://127.0.0.1:8443

      # LLM Provider Configuration
      # Usa "openai" per endpoint OpenAI-compatible (es. OmniRoute)
      # Usa "ollama" per istanza Ollama locale nativa
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}

      # OpenAI-Compatible Endpoint (es. OmniRoute, LiteLLM, vLLM)
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://10.0.0.105:20128/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # Modello di default per gli agenti (es. "Combinazione-Auto", "zoo-orchestrator")
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-}

      # Ollama Endpoint (fallback se LLM_PROVIDER=ollama)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}

      # Qdrant Vector DB
      QDRANT_HOST: nuxiva-qdrant
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - nuxiva_db:/app/data/db
      - nuxiva_certs:/app/data/certs
      - nuxiva_models:/app/data/models
      - /run/nuxiva/sandbox:/run/nuxiva/sandbox
      - /var/lib/nuxiva/brain:/run/nuxiva/brain
    depends_on:
      - nuxiva-qdrant

  nuxiva-qdrant:
    image: qdrant/qdrant:latest
    container_name: nuxiva-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - nuxiva_qdrant:/qdrant/storage

volumes:
  nuxiva_db:
  nuxiva_certs:
  nuxiva_models:
  nuxiva_qdrant:
